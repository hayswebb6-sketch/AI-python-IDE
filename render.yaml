services:
  - type: web
    name: ai-python-ide
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.16.0"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: LINUX_RUNNER_BASE_URL
        sync: false
      - key: LINUX_RUNNER_TOKEN
        sync: false
      - key: WINDOWS_RUNNER_BASE_URL
        sync: false
      - key: WINDOWS_RUNNER_TOKEN
        sync: false
