<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Python IDE — client-side Pyodide playground</title>
  <meta name="description" content="A fully static Python IDE. Monaco editor, a real CPython runtime in WebAssembly, and turtle / tkinter / pygame previews. No server, no build step.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">

  <!-- Monaco's AMD loader (classic script: must run before app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script type="module" src="assets/app.js"></script>
</head>
<body>

  <!-- ── Icon sprite ───────────────────────────────────────────────── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 21h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m7 9 3 3-3 3M12.5 15H17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-canvas" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m5 15 4-5 3 3 3-4 4 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="8.5" cy="8" r="1.4"/></symbol>
    <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m4 16 8-8 6 6-5 5H7l-3-3zM10 20h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close-panel" viewBox="0 0 24 24"><path d="M4 6h16M4 18h16M9 12l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app" id="app">

    <!-- ── Top bar ─────────────────────────────────────────────────── -->
    <header class="topbar">
      <button class="icon-btn" id="btn-sidebar" title="Toggle file panel (Ctrl+B)" aria-label="Toggle file panel">
        <svg class="icon"><use href="#i-sidebar"/></svg>
      </button>

      <a class="brand" href="./" aria-label="Python IDE home">
        <span class="brand-mark">py</span>
        <span class="brand-text">
          <strong>Python IDE</strong>
          <small>client-side · pyodide</small>
        </span>
      </a>

      <button class="btn ghost icon-only" id="btn-settings" title="Settings (Ctrl+,)" aria-label="Settings">
        <svg class="icon"><use href="#i-settings"/></svg>
      </button>

      <div class="runtime" id="runtime" data-state="loading" title="Python runtime status">
        <span class="runtime-dot"></span>
        <span id="runtime-text">Starting runtime…</span>
      </div>

      <div class="topbar-spacer"></div>

      <button class="btn ghost icon-only" id="btn-restart" title="Restart the Python runtime" aria-label="Restart runtime">
        <svg class="icon"><use href="#i-refresh"/></svg>
      </button>

      <div class="menu-wrap">
        <div class="split">
          <button class="btn primary" id="btn-run" disabled>
            <svg class="icon"><use href="#i-play"/></svg>
            <span>Run</span>
            <kbd class="kbd-inline">Ctrl ↵</kbd>
          </button>
          <button class="btn primary caret" id="btn-run-menu" aria-label="More run options" aria-haspopup="menu" aria-expanded="false" disabled>
            <svg class="icon"><use href="#i-chevron"/></svg>
          </button>
        </div>
        <div class="menu" id="run-menu" role="menu" hidden>
          <button role="menuitem" data-run="active"><span>Run active file</span><kbd>Ctrl ↵</kbd></button>
          <button role="menuitem" data-run="input"><span>Run with input…</span><kbd>Ctrl ⇧ ↵</kbd></button>
        </div>
      </div>

      <button class="btn danger" id="btn-stop" disabled>
        <svg class="icon"><use href="#i-stop"/></svg>
        <span>Stop</span>
      </button>
    </header>

    <!-- ── Workspace ───────────────────────────────────────────────── -->
    <div class="workspace">

      <aside class="sidebar" id="sidebar" aria-label="Files">
        <div class="sidebar-head">
          <span>Explorer</span>
          <div class="menu-wrap">
            <button class="icon-btn small" id="btn-new" title="New file" aria-label="New file" aria-haspopup="menu" aria-expanded="false">
              <svg class="icon"><use href="#i-plus"/></svg>
            </button>
            <div class="menu" id="new-menu" role="menu" hidden>
              <button role="menuitem" data-template="blank"><span>Blank file</span><kbd>py</kbd></button>
            </div>
          </div>
        </div>

        <ul class="file-list" id="file-list" role="listbox" aria-label="Workspace files"></ul>

        <div class="sidebar-foot">
          <button class="btn ghost small" id="btn-import">
            <svg class="icon"><use href="#i-upload"/></svg> Import
          </button>
          <button class="btn ghost small" id="btn-export" title="Download the active file">
            <svg class="icon"><use href="#i-download"/></svg> Export
          </button>
          <input type="file" id="file-input" accept=".py,.txt,.md,.json,.csv,.html,.js,.css" multiple hidden>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

      <main class="editor-pane">
        <div class="tabs" id="tabs" role="tablist" aria-label="Open files"></div>
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="editor-wrap">
          <div class="editor" id="editor"></div>
          <div class="empty-state" id="empty-state" hidden>
            <svg class="icon"><use href="#i-file"/></svg>
            <p>No file open</p>
            <button class="btn ghost small" id="btn-empty-new">Create a file</button>
          </div>
          <div class="editor-loading" id="editor-loading">Loading editor…</div>
        </div>
      </main>
    </div>

    <!-- ── Bottom panel ────────────────────────────────────────────── -->
    <div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize output panel"></div>

    <section class="console" id="console" aria-label="Output">
      <div class="console-head">
        <div class="console-tabs" role="tablist" aria-label="Output views">
          <button class="console-tab is-active" data-panel="terminal" role="tab" aria-selected="true">
            <svg class="icon"><use href="#i-terminal"/></svg> Terminal
          </button>
          <button class="console-tab" data-panel="canvas" role="tab" aria-selected="false">
            <svg class="icon"><use href="#i-canvas"/></svg> Canvas
            <span class="badge" id="badge-canvas" hidden></span>
          </button>
          <button class="console-tab" data-panel="window" role="tab" aria-selected="false">
            <svg class="icon"><use href="#i-window"/></svg> Window
            <span class="badge" id="badge-window" hidden></span>
          </button>
        </div>
        <div class="console-actions">
          <button class="icon-btn small" id="btn-clear" title="Clear terminal" aria-label="Clear terminal">
            <svg class="icon"><use href="#i-eraser"/></svg>
          </button>
          <button class="icon-btn small" id="btn-hide-console" title="Hide panel (Ctrl+`)" aria-label="Hide panel">
            <svg class="icon"><use href="#i-close-panel"/></svg>
          </button>
        </div>
      </div>

      <div class="console-body">
        <div class="panel panel-terminal is-active" id="panel-terminal" role="tabpanel">
          <div class="terminal" id="terminal" tabindex="0" aria-live="polite" aria-label="Terminal output"></div>
          <form class="prompt" id="prompt-form" autocomplete="off">
            <span class="prompt-path" id="prompt-path">~</span>
            <span class="prompt-sigil" id="prompt-sigil">$</span>
            <input class="prompt-input" id="prompt-input" spellcheck="false" autocapitalize="off"
                   autocorrect="off" placeholder="Type a command — try “help”" aria-label="Terminal command">
          </form>
        </div>

        <div class="panel panel-canvas" id="panel-canvas" role="tabpanel" hidden>
          <div class="canvas-stage">
            <canvas id="canvas" width="720" height="480" aria-label="Graphics output"></canvas>
          </div>
          <div class="panel-hint">Drawing output from <code>turtle</code> and <code>pygame</code></div>
        </div>

        <div class="panel panel-window" id="panel-window" role="tabpanel" hidden>
          <div class="tk-stage" id="tk-stage"></div>
          <div class="tk-empty" id="tk-empty">Run a <code>tkinter</code> script to see its window here.</div>
        </div>
      </div>
    </section>

    <!-- ── Status bar ──────────────────────────────────────────────── -->
    <footer class="statusbar">
      <span class="status-item"><svg class="icon"><use href="#i-bolt"/></svg> <span id="status-branch">main</span></span>
      <span class="status-item" id="status-runtime">Python 3.14 · WebAssembly</span>
      <span class="status-spacer"></span>
      <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
      <span class="status-item"><select id="status-language" class="status-select" aria-label="Language"></select></span>
      <span class="status-item" id="status-indent">Spaces: 4</span>
      <span class="status-item">UTF-8</span>
    </footer>
  </div>

  <!-- ── Dialog (new file / rename / run with input) ───────────────── -->
  <dialog class="dialog" id="dialog">
    <form method="dialog" class="dialog-form" id="dialog-form">
      <h2 class="dialog-title" id="dialog-title">Title</h2>
      <label class="dialog-label" id="dialog-label" for="dialog-input">Label</label>
      <input class="dialog-input" id="dialog-input" autocomplete="off" spellcheck="false">
      <textarea class="dialog-input dialog-textarea" id="dialog-textarea" rows="6" spellcheck="false" hidden></textarea>
      <p class="dialog-hint" id="dialog-hint"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel" id="dialog-cancel" type="button">Cancel</button>
        <button class="btn primary" value="ok" id="dialog-ok" type="submit">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="sr-only" id="sr-live" aria-live="assertive"></div>
</body>
</html>
